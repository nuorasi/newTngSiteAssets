<!DOCTYPE html>
<html>

<head>
<link rel="shortcut icon" href="{{ asset('https://cdn.jsdelivr.net/gh/nuorasi/newTngSiteAssets/tngFavicon.jpg') }}">
<meta charset="UTF-8">

<style>

html,
body {
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body {
    position:relative;
}


/* =========================================================
   HERO CONTAINER
   ========================================================= */

#hero1 {

    position:relative;

    width:100%;
    height:100%;

    overflow:hidden;
}


/* =========================================================
   PARTICLE LAYER
   ========================================================= */

#particleCanvas {

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    z-index:0;

    pointer-events:none;
}


/* =========================================================
   LOGO LAYER
   ========================================================= */

#logoSVG {

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    z-index:2;

    pointer-events:none;
}


.hero-arc-reveal {

    transform-box:fill-box;
    transform-origin:0% 50%;
    transform:scaleX(0);

}


#hero-wordmark {

    opacity:0;
    transform:translateY(14px);

}


#hero-tagline {

    opacity:0;
    transform:translateY(10px);

}


body.hero-animate #hero-gold-reveal {

    animation:
        hero-reveal-arc
        0.8s
        cubic-bezier(.22,1,.36,1)
        0.05s
        forwards;

}


body.hero-animate #hero-blue-reveal {

    animation:
        hero-reveal-arc
        0.9s
        cubic-bezier(.22,1,.36,1)
        0.22s
        forwards;

}


body.hero-animate #hero-wordmark {

    animation:
        hero-fade-up
        0.65s
        cubic-bezier(.22,1,.36,1)
        0.45s
        forwards;

}


body.hero-animate #hero-tagline {

    animation:
        hero-fade-up
        0.65s
        cubic-bezier(.22,1,.36,1)
        0.70s
        forwards;

}


@keyframes hero-reveal-arc {

from {
    transform:scaleX(0);
}

to {
    transform:scaleX(1);
}

}


@keyframes hero-fade-up {

from {

    opacity:0;
    transform:translateY(14px);

}

to {

    opacity:1;
    transform:translateY(0);

}

}

</style>

</head>


<body>


<section id="hero1">


<canvas id="particleCanvas"></canvas>


<svg
    id="logoSVG"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1500 450"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-label="The Nuorasi Group"
>

<!-- KEEP EXISTING SVG CONTENT HERE -->

</svg>


</section>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>

function resizeParticleCanvas() {

    const canvas =
        document.getElementById("particleCanvas");


    if (!canvas) return;


    const rect =
        document.documentElement.getBoundingClientRect();


    const width =
        rect.width;


    const height =
        rect.height;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    if (typeof renderer !== "undefined") {

        renderer.setSize(
            width,
            height,
            false
        );

    }


    if (typeof camera !== "undefined") {

        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();

    }


    console.log(
        "Canvas resize:",
        width,
        height
    );

}



window.addEventListener(
    "resize",
    resizeParticleCanvas
);


window.addEventListener(
    "orientationchange",
    resizeParticleCanvas
);


window.addEventListener(
    "load",
    () => {

        setTimeout(
            resizeParticleCanvas,
            100
        );

    }
);


const hero1 =
    document.getElementById("hero1");


if (hero1) {

    const resizeObserver =
        new ResizeObserver(
            () => resizeParticleCanvas()
        );


    resizeObserver.observe(hero1);

}

</script>



<script src="https://cdn.jsdelivr.net/gh/nuorasi/newTngSiteAssets@60c256c/newParticle.js"></script>


<script>

(function(){

let heroAnimationStarted=false;


function startHeroAnimation(){

    if(heroAnimationStarted)
        return;


    heroAnimationStarted=true;


    document.body.classList.add(
        "hero-animate"
    );

}


window.addEventListener(
    "message",
    function(event){

        if(
            event.data &&
            event.data.type ===
            "nuorasi-start-hero-animation"
        ){

            startHeroAnimation();

        }

    }
);


setTimeout(
    startHeroAnimation,
    50
);


})();

</script>


</body>

</html>
